services:
  - type: web
    name: network-agenda-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        value: https://qbqqfkvvbvsdpwsajkha.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOW_LEGACY_PASSWORD_LOGIN
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
